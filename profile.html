<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - EVGames</title>

    <link rel="stylesheet" href="profile.css">
</head>

<body>

    <div class="profile-card">

        <a href="index.html" class="back-button">
            ← Back
        </a>

        <div class="profile-image">
            <img id="profilePhoto" src="" alt="Profile Photo">
        </div>

        <h1 id="profileName">My Profile</h1>

        <p id="profileEmail"></p>

        <div class="profile-info">

            <div class="info-box">
                <span>Name</span>
                <strong id="nameValue">-</strong>
            </div>

            <div class="info-box">
                <span>Email</span>
                <strong id="emailValue">-</strong>
            </div>

            <div class="info-box">
                <span>Login method</span>
                <strong id="loginMethod">-</strong>
            </div>

        </div>

        <button id="logoutButton" class="logout-button">
            Logout
        </button>

    </div>


    <script type="module">

        import {
            auth,
            onAuthStateChanged,
            signOut
        } from "./firebase.js";


        const profilePhoto =
            document.getElementById("profilePhoto");

        const profileName =
            document.getElementById("profileName");

        const profileEmail =
            document.getElementById("profileEmail");

        const nameValue =
            document.getElementById("nameValue");

        const emailValue =
            document.getElementById("emailValue");

        const loginMethod =
            document.getElementById("loginMethod");

        const logoutButton =
            document.getElementById("logoutButton");


        onAuthStateChanged(auth, (user) => {

            if (!user) {

                window.location.href = "index.html";

                return;
            }


            // Get user information from Firebase

            const name =
                user.displayName || "EVGames User";

            const email =
                user.email || "No email available";


            profileName.textContent = name;

            profileEmail.textContent = email;

            nameValue.textContent = name;

            emailValue.textContent = email;


            // Profile picture

            if (user.photoURL) {

                profilePhoto.src = user.photoURL;

            } else {

                profilePhoto.src =
                    "https://via.placeholder.com/150";

            }


            // Detect login method

            const providers =
                user.providerData;


            if (
                providers.some(
                    provider =>
                        provider.providerId === "google.com"
                )
            ) {

                loginMethod.textContent = "Google";

            } else if (
                providers.some(
                    provider =>
                        provider.providerId === "password"
                )
            ) {

                loginMethod.textContent =
                    "Email & Password";

            } else {

                loginMethod.textContent =
                    "Other";

            }

        });


        // Logout

        logoutButton.addEventListener(
            "click",
            async () => {

                try {

                    await signOut(auth);

                    window.location.href =
                        "index.html";

                } catch (error) {

                    console.error(
                        "Logout error:",
                        error
                    );

                    alert(
                        "Could not log out. Please try again."
                    );

                }

            }
        );

    </script>

</body>

</html>
